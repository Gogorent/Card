  .card .who { position: absolute; left: 6%; right: 6%; bottom: 9%; }
  .card h1 {
    margin: 0;
    font-size: calc(var(--cw) * .082); line-height: 1.05; font-weight: 700; letter-spacing: -.01em;
  }
  .card .role {
    margin: calc(var(--cw) * .018) 0 0;
    font-size: calc(var(--cw) * .043); font-weight: 500; color: #CFEFD6;
  }

  .save {
    margin-top: 20px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 56px; border-radius: 16px;
    background: linear-gradient(180deg, var(--green-hi) 0%, var(--green) 100%);
    color: var(--card);
    font-weight: 700; font-size: 18px;
    box-shadow: 0 10px 30px rgba(91,226,82,.25), inset 0 1px 0 rgba(255,255,255,.45);
    transition: transform .08s ease;
  }
  .save:active { transform: scale(.98); }
  .save svg { width: 22px; height: 22px; }
  .hint { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--muted); }

  .list { margin-top: 22px; display: grid; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 14px;
    min-height: 64px; padding: 12px 14px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(155,254,117,.12); border-radius: 16px;
  }
  .row:active { background: rgba(91,226,82,.08); }
  .ic {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--green-mid) 0%, var(--green-deep) 100%);
    display: grid; place-items: center;
  }
  .ic svg { width: 20px; height: 20px; stroke: #fff; }
  .txt { min-width: 0; flex: 1; }
  .lbl {
    display: block;
    font-family: "Fira Sans Condensed", "Fira Sans", sans-serif;
    font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .val {
    display: block; margin-top: 2px;
    font-size: 17px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chev { flex: none; width: 18px; height: 18px; stroke: var(--green); }
</style>
</head>
<body>
  <main>
    <section class="card" aria-label="Business card">
      <svg class="fx" viewBox="0 0 400 250" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <radialGradient id="s1" gradientUnits="userSpaceOnUse" cx="470" cy="-130" r="300">
            <stop offset="0" stop-color="#03251A"/>
            <stop offset=".72" stop-color="#0A3D1B"/>
            <stop offset=".93" stop-color="#1B6A26"/>
            <stop offset="1" stop-color="#3AB33F"/>
          </radialGradient>
          <radialGradient id="s2" gradientUnits="userSpaceOnUse" cx="440" cy="-100" r="220">
            <stop offset="0" stop-color="#0B4914"/>
            <stop offset=".58" stop-color="#207523"/>
            <stop offset=".84" stop-color="#3AB33F"/>
            <stop offset=".96" stop-color="#5BE252"/>
            <stop offset="1" stop-color="#9BFE75"/>
          </radialGradient>
          <radialGradient id="haze" cx=".5" cy="1" r=".6">
            <stop offset="0" stop-color="#0B4914" stop-opacity=".55"/>
            <stop offset="1" stop-color="#0B4914" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5"/>
          </filter>
        </defs>
        <rect x="0" y="120" width="400" height="130" fill="url(#haze)"/>
